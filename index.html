<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الحضور والغياب</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#faf7f5;--fg:#2a2326;--card:#fff;--bd:#e7dfe2;--ac:#b83a6b;--mut:#7d7075;--no:#c0392b;--ok:#1e8a5a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0 .8em;display:flex;justify-content:space-between;align-items:center}
button,input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 10px}
.mut{color:var(--mut);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.grp{display:flex;justify-content:space-between;width:100%;text-align:start;margin-bottom:8px}
.badge{background:var(--no);color:#fff;border-radius:99px;padding:0 10px;font-size:.85rem}
.badge.z{background:var(--ok)}
.girl{padding:9px 12px;border-bottom:1px solid var(--bd)}
.bad{color:var(--no)}.good{color:var(--ok)}
</style>
</head>
<body>
<main>
<h1>📋 الحضور والغياب <button id="adminBtn">دخول الأدمن</button></h1>

<div id="admin" class="card" style="display:none">
  <h2>رفع شيت الحضور (عمود Attendance بقيم (Yes) / (No))</h2>
  <div class="row"><input id="pw" type="password" placeholder="باسورد الأدمن" dir="ltr"><input type="file" id="aFile" accept=".xlsx,.xls,.csv"></div>
  <div id="aMsg" class="mut"></div>
  <div id="aPrev"></div>
</div>

<div id="viewer" class="mut">جاري التحميل…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ الإعدادات — غيّرها بس ============ */
const SPREADSHEET_ID = "PUT_GOOGLE_SPREADSHEET_ID_HERE"; // الجزء اللي بين /d/ و /edit في اللينك
const SHEET_NAMES = ["أسرة القديسة بربتوا", "أسرة القديسة أناسطاسية"];
/* ============================================== */

const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let roster=[],att=null,openG=null,pending=null;

/* ---- شيت الأسماء من Google Sheets مباشرة ---- */
async function loadRoster(){
  let all=[];
  for(const name of SHEET_NAMES){
    const url=`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
    const r=await fetch(url);if(!r.ok)throw new Error('تعذّر فتح الشيت: '+name);
    const wb=XLSX.read(await r.text(),{type:'string'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
    let g='';
    rows.forEach((row,i)=>{
      if(i===0)return; // صف العناوين
      const a=String(row[0]||'').trim();if(a)g=a; // الخلايا المدمجة بتيجي فاضية فبنكمل من اللي فوق
      const girl=row.slice(1).map(x=>String(x||'').trim()).find(x=>x);
      if(g&&girl)all.push({g,n:girl});
    });
  }
  return all;
}

/* ---- شيت الحضور ---- */
function parseAtt(rows){
  const clean=x=>String(x||'').replace(/[()\[\]]/g,'').trim().toLowerCase();
  const hi=rows.findIndex(r=>r.some(c=>clean(c)==='attendance'));
  const ai=hi>=0?rows[hi].findIndex(c=>clean(c)==='attendance'):10;
  const ni=hi>=0?rows[hi].findIndex(c=>/name|الاسم|اسم/i.test(String(c))):-1;
  const res=[];
  rows.forEach((r,i)=>{
    if(i<=hi)return;
    const v=clean(r[ai]);if(v!=='yes'&&v!=='no')return;
    let name=ni>=0?String(r[ni]||'').trim():'';
    if(!name)name=r.map(x=>String(x||'').trim()).find((x,j)=>j!==ai&&x&&isNaN(x)&&!/^\(?(yes|no)\)?$/i.test(x));
    if(name)res.push({n:name,no:v==='no'});
  });
  return res;
}
$('aFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  pending=parseAtt(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}));
  if(!pending.length){$('aMsg').innerHTML='<span class="bad">مفيش صفوف (Yes)/(No) في الملف</span>';return}
  const known=new Set(roster.map(x=>norm(x.n)));
  const unm=pending.filter(x=>!known.has(norm(x.n)));
  $('aMsg').textContent=`${pending.length} صف · No: ${pending.filter(x=>x.no).length} · أسماء مش مطابقة: ${unm.length}`;
  $('aPrev').innerHTML=(unm.length?`<p class="bad">${unm.map(x=>esc(x.n)).join('، ')}</p>`:'')+'<button class="pri" id="sv">حفظ ونشر</button>';
  $('sv').onclick=async()=>{
    try{
      const r=await fetch('/api/attendance',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value,rows:pending})});
      if(r.status===401)throw new Error('الباسورد غلط');
      if(!r.ok)throw new Error('حصل خطأ');
      $('aPrev').innerHTML='<p class="good">✔ تم النشر</p>';loadAtt();
    }catch(x){$('aPrev').innerHTML='<p class="bad">فشل الحفظ: '+esc(x.message)+'</p>'}
  };
};

/* ---- العرض ---- */
function render(){
  const v=$('viewer');
  if(!roster.length){v.textContent='مفيش أسماء.';return}
  const no=new Set(((att&&att.rows)||[]).filter(x=>x.no).map(x=>norm(x.n)));
  const groups={};roster.forEach(x=>(groups[x.g]=groups[x.g]||[]).push(x.n));
  let h=att?`<p class="mut">آخر تحديث للحضور: ${new Date(att.at).toLocaleString('ar-EG')}</p>`:'<p class="mut">لسه مفيش شيت حضور.</p>';
  Object.keys(groups).forEach(g=>{
    const miss=groups[g].filter(n=>no.has(norm(n)));
    h+=`<button class="grp" data-g="${esc(g)}"><span>${esc(g)}</span><span class="badge ${miss.length?'':'z'}">${miss.length}</span></button>`;
    if(openG===g)h+=`<div class="card">${miss.length?miss.map(n=>`<div class="girl">❌ ${esc(n)}</div>`).join(''):'<div class="girl good">كلهم حاضرين ✔</div>'}</div>`;
  });
  v.innerHTML=h;
  v.querySelectorAll('.grp').forEach(b=>b.onclick=()=>{openG=openG===b.dataset.g?null:b.dataset.g;render()});
}

async function loadAtt(){try{const r=await fetch('/api/attendance');att=await r.json();render()}catch(e){}}
/* ---- تشغيل ---- */
(async()=>{
  try{roster=await loadRoster();render()}
  catch(e){$('viewer').innerHTML='<span class="bad">'+esc(e.message)+'<br>اتأكد إن الشيت Share ▸ Anyone with the link ▸ Viewer وإن أسماء الشيتات صح.</span>';}
  $('adminBtn').onclick=()=>{const a=$('admin');a.style.display=a.style.display?'':'none'};
  loadAtt();
})();
</script>
</body>
</html>
