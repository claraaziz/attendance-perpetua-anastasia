<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الحضور والغياب</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--p1:#6d3fc0;--p2:#d6458f;--bg:#f6f1fb;--fg:#2b2236;--card:#fff;--bd:#eadff5;--mut:#85779a;--no:#d6335a;--ok:#1f9d6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:26px 16px 56px;text-align:center}
header h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;opacity:.85;font-size:.9rem}
main{max-width:720px;margin:-34px auto 40px;padding:0 14px}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:5px;box-shadow:0 6px 20px rgba(109,63,192,.15);margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:12px;border-radius:12px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(109,63,192,.06)}
.card h2{font-size:1.05rem;margin:0 0 12px;color:var(--p1)}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:15px 16px;margin-bottom:6px;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;border-inline-start:6px solid var(--p1)}
.grp.open{background:#f1e8fb}
.badge{background:var(--no);color:#fff;border-radius:99px;padding:2px 12px;font-size:.85rem}
.badge.z{background:var(--ok)}
.list{background:#fff;border:1px solid var(--bd);border-radius:14px;margin:0 6px 12px;overflow:hidden}
.girl{padding:11px 14px;border-bottom:1px solid var(--bd)}
.girl:last-child{border:0}
input[type=password],input[type=file]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font:inherit;margin-bottom:10px;background:#fcfaff}
.ok{width:100%;border:0;padding:13px;border-radius:12px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));cursor:pointer}
.ok:disabled{opacity:.6}
.mut{color:var(--mut);font-size:.88rem}.bad{color:var(--no)}.good{color:var(--ok)}
</style>
</head>
<body>
<header><h1>📋 الحضور والغياب</h1><p>أسرة القديسة بربتوا · أسرة القديسة أناسطاسية</p></header>
<main>
<div class="tabs"><button id="tV" class="on">الغياب</button><button id="tA">الأدمن</button></div>

<section id="vV"><div id="viewer" class="mut">جاري التحميل…</div></section>

<section id="vA" style="display:none" class="card">
  <h2>رفع شيت الحضور</h2>
  <input id="pw" type="password" placeholder="باسورد الأدمن" dir="ltr">
  <input type="file" id="aFile" accept=".xlsx,.xls,.csv">
  <button class="ok" id="okBtn">OK ✔</button>
  <div id="aMsg" style="margin-top:12px"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ الإعدادات ============ */
const SPREADSHEET_ID = "1FcAeRnSQDavdwoDxCf6LHgtia7nwRH6nfL335Syt3no";
const SHEET_NAMES = ["أسرة القديسة بربتوا", "أسرة القديسة أناسطاسية"];
/* =================================== */

const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let roster=[],att=null,openG=null;

async function loadRoster(){
  let all=[];
  for(const name of SHEET_NAMES){
    const url=`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
    const r=await fetch(url);if(!r.ok)throw new Error('تعذّر فتح الشيت: '+name);
    const wb=XLSX.read(await r.text(),{type:'string'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
    let g='';
    rows.forEach((row,i)=>{
      if(i===0)return;
      const a=String(row[0]||'').trim();if(a)g=a;
      const girl=row.slice(1).map(x=>String(x||'').trim()).find(x=>x);
      if(g&&girl)all.push({g,n:girl});
    });
  }
  return all;
}
function parseAtt(rows){
  const clean=x=>String(x||'').replace(/[()\[\]]/g,'').trim().toLowerCase();
  const hi=rows.findIndex(r=>r.some(c=>clean(c)==='attendance'));
  const ai=hi>=0?rows[hi].findIndex(c=>clean(c)==='attendance'):10;
  const ni=hi>=0?rows[hi].findIndex(c=>/name|الاسم|اسم/i.test(String(c))):-1;
  const res=[];
  rows.forEach((r,i)=>{
    if(i<=hi)return;
    const v=clean(r[ai]);if(v!=='yes'&&v!=='no')return;
    let name=ni>=0?String(r[ni]||'').trim():'';
    if(!name)name=r.map(x=>String(x||'').trim()).find((x,j)=>j!==ai&&x&&isNaN(x)&&!/^\(?(yes|no)\)?$/i.test(x));
    if(name)res.push({n:name,no:v==='no'});
  });
  return res;
}

$('okBtn').onclick=async()=>{
  const f=$('aFile').files[0],m=$('aMsg'),b=$('okBtn');
  if(!f){m.innerHTML='<span class="bad">اختار الملف الأول</span>';return}
  if(!$('pw').value){m.innerHTML='<span class="bad">اكتب الباسورد</span>';return}
  b.disabled=true;m.textContent='جاري الحفظ…';
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=parseAtt(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}));
    if(!rows.length)throw new Error('مفيش صفوف (Yes)/(No) في الملف — اتأكد من عمود Attendance');
    const r=await fetch('/api/attendance',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value,rows})});
    if(r.status===401)throw new Error('الباسورد غلط');
    if(!r.ok)throw new Error(await r.text()||'حصل خطأ');
    const known=new Set(roster.map(x=>norm(x.n)));
    const unm=rows.filter(x=>!known.has(norm(x.n)));
    m.innerHTML=`<span class="good">✔ تم الحفظ (${rows.length} صف، No: ${rows.filter(x=>x.no).length})</span>`+(unm.length?`<p class="bad">أسماء مش مطابقة لشيت الأسماء: ${unm.map(x=>esc(x.n)).join('، ')}</p>`:'');
    await loadAtt();
  }catch(e){m.innerHTML='<span class="bad">فشل الحفظ: '+esc(e.message)+'</span>'}
  b.disabled=false;
};

function render(){
  const v=$('viewer');
  if(!roster.length){return}
  const no=new Set(((att&&att.rows)||[]).filter(x=>x.no).map(x=>norm(x.n)));
  const groups={};roster.forEach(x=>(groups[x.g]=groups[x.g]||[]).push(x.n));
  let h=att?`<p class="mut">آخر تحديث للحضور: ${new Date(att.at).toLocaleString('ar-EG')}</p>`:'<p class="mut">لسه مفيش شيت حضور اترفع.</p>';
  Object.keys(groups).forEach(g=>{
    const miss=groups[g].filter(n=>no.has(norm(n)));
    h+=`<button class="grp ${openG===g?'open':''}" data-g="${esc(g)}"><span>${esc(g)}</span><span class="badge ${miss.length?'':'z'}">${miss.length}</span></button>`;
    if(openG===g)h+=`<div class="list">${miss.length?miss.map(n=>`<div class="girl">❌ ${esc(n)}</div>`).join(''):'<div class="girl good">كلهم حاضرين ✔</div>'}</div>`;
  });
  v.innerHTML=h;
  v.querySelectorAll('.grp').forEach(b=>b.onclick=()=>{openG=openG===b.dataset.g?null:b.dataset.g;render()});
}

function tab(a){$('vA').style.display=a?'':'none';$('vV').style.display=a?'none':'';$('tA').classList.toggle('on',a);$('tV').classList.toggle('on',!a)}
$('tV').onclick=()=>tab(false);$('tA').onclick=()=>tab(true);

async function loadAtt(){try{const r=await fetch('/api/attendance');att=await r.json();render()}catch(e){}}
(async()=>{
  try{roster=await loadRoster();render()}
  catch(e){$('viewer').innerHTML='<span class="bad">'+esc(e.message)+'<br>اتأكد إن الشيت Share ▸ Anyone with the link ▸ Viewer وإن SPREADSHEET_ID صح.</span>'}
  loadAtt();
})();
</script>
</body>
</html>
